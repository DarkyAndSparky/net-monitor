services:
  net-monitor:
    build: .
    container_name: net-monitor
    restart: unless-stopped
    ports:
      - "9221:9221"   # HTTPS
      - "9222:9222"   # HTTP → редирект на HTTPS
    volumes:
      - ./data:/app/data
    environment:
      - PORT=9221
      - HTTP_REDIRECT_PORT=9222
      # - METRICS_TOKEN=секрет   # раскомментировать для защиты /metrics
      # - RATE_LIMIT_DISABLED=true   # отключить rate limiting (только для отладки!)
    network_mode: host   # нужен для ping в локальной сети
    cap_add:
      - NET_RAW
      - NET_ADMIN
